---
Name: cwpconfig
After: 'cwp-core/*'
---
SilverStripe\SiteConfig\SiteConfig:
  extensions:
   - CWP\CWP\Extensions\CustomSiteConfig

SilverStripe\CMS\Model\SiteTree:
  extensions:
    - CWP\CWP\Extensions\CwpSiteTreeExtension

SilverStripe\Security\Member:
  title_format:
    columns:
      - FirstName
      - Surname
    sep: ' '
